<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Libretto di volo</title>
<meta name="description" content="Libretto personale di voli e campetti di parapendio, con diario, vele, scadenze e checklist pre-volo.">
<meta name="theme-color" content="#16180f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Libretto">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;1,8..60,400&display=swap">
<style>
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
code{font-size:.9em}
/* Layout: toppa ricamata del corso in testata, schede a pagina singola, barra di navigazione in basso, fogli a scomparsa per i dettagli */
:root{
  --bg:#eff0e7; --paper:#fbfbf7; --ink:#1b1e15; --muted:#666a58; --line:#dcdccc;
  --olive:#56651f; --olive-soft:#e4e8cf; --amber:#c98a12; --amber-ink:#8a5c08; --amber-soft:#f6e7c4;
  --ok:#2f7a4d; --ok-soft:#dcefe2; --warn:#a86f12; --warn-soft:#f7ebd2; --bad:#b03c34; --bad-soft:#f6dfdc;
  --hero-bg:#16180f; --hero-fg:#e6d4a3; --hero-dim:#a99c78; --stitch:#7d8c38;
  --f-patch:"Saira Stencil One","Barlow Condensed",Impact,sans-serif;
  --f-label:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,sans-serif;
  --f-diary:"Source Serif 4",Georgia,serif;
  --shadow:0 1px 2px rgba(27,30,21,.06),0 4px 14px rgba(27,30,21,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111309; --paper:#1a1d14; --ink:#ece7d6; --muted:#a2a38d; --line:#2f3326;
  --olive:#aebd6f; --olive-soft:#262d17; --amber:#f0b43f; --amber-ink:#f0c46a; --amber-soft:#382a0f;
  --ok:#73c995; --ok-soft:#163021; --warn:#e6b45c; --warn-soft:#33280f; --bad:#ee8a82; --bad-soft:#3a1c19;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111309; --paper:#1a1d14; --ink:#ece7d6; --muted:#a2a38d; --line:#2f3326;
  --olive:#aebd6f; --olive-soft:#262d17; --amber:#f0b43f; --amber-ink:#f0c46a; --amber-soft:#382a0f;
  --ok:#73c995; --ok-soft:#163021; --warn:#e6b45c; --warn-soft:#33280f; --bad:#ee8a82; --bad-soft:#3a1c19;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--hero-bg)}
button{font:inherit;color:inherit}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* testata */
.hero{background:var(--hero-bg);color:var(--hero-fg);border-bottom:3px dashed var(--stitch);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 18px}
.hero-in{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:76px;height:76px;flex:none;border-radius:50%;box-shadow:0 0 0 2px var(--stitch),0 6px 18px rgba(0,0,0,.45)}
.eyebrow{margin:0 0 2px;font:600 .74rem var(--f-label);letter-spacing:.16em;text-transform:uppercase;color:var(--hero-dim)}
.hero h1{margin:0;font:400 2rem/1 var(--f-patch);letter-spacing:.02em;text-wrap:balance}
.hstats{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px dashed color-mix(in srgb,var(--hero-fg) 30%,transparent);border-radius:12px}
.hstats div{padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.hstats div+div{border-left:1px dashed color-mix(in srgb,var(--hero-fg) 30%,transparent)}
.hstats b{font:700 1.6rem/1 var(--f-label);font-variant-numeric:tabular-nums;color:#fff}
.hstats span{font:600 .7rem var(--f-label);letter-spacing:.14em;text-transform:uppercase;color:var(--hero-dim)}
.alert{display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--amber) 22%,var(--hero-bg));border:1px solid color-mix(in srgb,var(--amber) 55%,transparent);color:#fff;border-radius:10px;padding:10px 12px;text-align:left;cursor:pointer;width:100%}
.alert svg{color:#f3c15a}
.alert small{display:block;color:var(--hero-fg);font-size:.82rem}

/* pagina */
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(150px + env(safe-area-inset-bottom,0px))}
.status{margin:0 0 12px;padding:10px 12px;border-radius:10px;background:var(--warn-soft);font-size:.9rem}
section.view{display:flex;flex-direction:column;gap:12px}
.vhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.vhead h2{margin:0;font:700 1.5rem/1.1 var(--f-label);letter-spacing:.02em}
.month{margin:10px 0 -2px;font:700 .8rem var(--f-label);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.hint{margin:0;color:var(--muted);font-size:.92rem}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 .95rem var(--f-body);border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:10px 16px;cursor:pointer;min-height:46px;text-decoration:none}
.btn.primary{background:var(--olive);border-color:var(--olive);color:var(--paper)}
.btn.amber{background:var(--amber);border-color:var(--amber);color:#1d1406}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent);background:none}
.btn.small{min-height:38px;padding:6px 12px;font-size:.9rem;border-radius:10px}
.btn:focus-visible,.card:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.tabbar button:focus-visible,.chip:focus-visible,.seg button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;color:var(--muted);font:700 .85rem var(--f-label);letter-spacing:.1em;text-transform:uppercase;padding:8px 4px;border-radius:9px;cursor:pointer;min-height:38px}
.seg button[aria-pressed="true"]{background:var(--olive);color:var(--paper)}

.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
button.card{width:100%;text-align:left;cursor:pointer;color:var(--ink);font:inherit}
.entry{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px 10px 10px}
.dblock{border-radius:10px;background:var(--olive-soft);color:var(--olive);text-align:center;padding:7px 0 6px}
.entry.camp .dblock{background:var(--amber-soft);color:var(--amber-ink)}
.dblock b{display:block;font:700 1.55rem/1 var(--f-label)}
.dblock span{font:700 .68rem var(--f-label);letter-spacing:.14em;text-transform:uppercase}
.emain{min-width:0;display:flex;flex-direction:column;gap:3px}
.emain strong{font:600 1.04rem/1.2 var(--f-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;color:var(--muted);font-size:.84rem}
.chip-t{font:700 .68rem var(--f-label);letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:var(--olive-soft);color:var(--olive)}
.chip-t.camp{background:var(--amber-soft);color:var(--amber-ink)}
.chip-t.ex{background:var(--line);color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:1px}
.eright{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.eright b{font:700 1.3rem/1 var(--f-label);font-variant-numeric:tabular-nums}
.eright small{font:600 .68rem var(--f-label);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.spark{width:64px;height:18px;display:block}

.empty{padding:26px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.empty strong{font:700 1.25rem var(--f-label);letter-spacing:.02em}
.empty p{margin:0;color:var(--muted);max-width:34ch}
.empty .art{width:120px;height:72px;color:var(--olive)}
.empty .row{margin-top:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.due{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px 10px 10px}
.cd{border-radius:10px;text-align:center;padding:8px 0;background:var(--ok-soft);color:var(--ok)}
.cd b{display:block;font:700 1.5rem/1 var(--f-label);font-variant-numeric:tabular-nums}
.cd span{font:700 .64rem var(--f-label);letter-spacing:.12em;text-transform:uppercase}
.due.warn .cd{background:var(--warn-soft);color:var(--warn)} .due.bad .cd{background:var(--bad-soft);color:var(--bad)}
.due strong{display:block;font-weight:600}
.due small{color:var(--muted);font-size:.86rem}
.chevron{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:500 .9rem var(--f-body);border:1px dashed var(--muted);background:none;color:var(--ink);border-radius:99px;padding:7px 13px;cursor:pointer;min-height:38px}
.chip[aria-pressed="true"]{border-style:solid;border-color:var(--olive);background:var(--olive-soft);color:var(--olive);font-weight:600}

.vcard{padding:14px;display:flex;flex-direction:column;gap:10px}
.vtop{display:flex;align-items:center;gap:12px}
.vicon{width:42px;height:42px;border-radius:12px;background:var(--olive-soft);color:var(--olive);display:grid;place-items:center;flex:none}
.vtop strong{display:block;font-weight:600;font-size:1.05rem}
.vtop small{color:var(--muted);font-size:.86rem}
.star{margin-left:auto;font:700 .68rem var(--f-label);letter-spacing:.1em;text-transform:uppercase;color:var(--amber-ink);background:var(--amber-soft);padding:3px 8px;border-radius:99px;white-space:nowrap}
.mini{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px dashed var(--line);padding-top:10px}
.mini div{display:flex;flex-direction:column}
.mini b{font:700 1.15rem var(--f-label);font-variant-numeric:tabular-nums}
.mini span{font:600 .68rem var(--f-label);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

.ready{display:flex;align-items:center;gap:14px;padding:14px}
.ring{width:64px;height:64px;flex:none}
.ready strong{display:block;font:700 1.3rem var(--f-label)}
.ready small{color:var(--muted)}
.cgroup{overflow:hidden}
.cgroup h3{margin:0;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;font:700 .82rem var(--f-label);letter-spacing:.16em;text-transform:uppercase;color:var(--olive);border-bottom:1px solid var(--line)}
.cgroup h3 span{color:var(--muted);letter-spacing:.06em}
.citem{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;cursor:pointer}
.citem+.citem{border-top:1px solid var(--line)}
.citem input{appearance:none;-webkit-appearance:none;width:24px;height:24px;border:2px solid var(--muted);border-radius:7px;flex:none;margin:0;display:grid;place-items:center;background:var(--paper);cursor:pointer}
.citem input:checked{background:var(--olive);border-color:var(--olive)}
.citem input:checked::after{content:"";width:6px;height:11px;border:solid var(--paper);border-width:0 2.5px 2.5px 0;transform:translate(0,-1px) rotate(45deg)}
.citem input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.citem.done span{color:var(--muted)}

.backup{padding:14px;display:flex;flex-direction:column;gap:10px;margin-top:8px;box-shadow:none;background:none;border-style:dashed}
.lbl{font:700 .76rem var(--f-label);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* barra in basso */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--paper);border-top:1px solid var(--line);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabbar button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 9px;color:var(--muted);cursor:pointer;font:600 .74rem var(--f-label);letter-spacing:.08em;text-transform:uppercase}
.tabbar button .pillbg{display:grid;place-items:center;width:52px;height:30px;border-radius:99px}
.tabbar button[aria-selected="true"]{color:var(--olive)}
.tabbar button[aria-selected="true"] .pillbg{background:var(--olive-soft)}
.fab{position:fixed;z-index:7;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));border-radius:99px;padding:12px 18px 12px 14px;box-shadow:0 8px 22px rgba(0,0,0,.25);font-weight:700}

/* fogli */
.sheet-bg{position:fixed;inset:0;background:rgba(12,14,8,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:94%;display:flex;flex-direction:column;border-radius:20px 20px 0 0;overflow:hidden;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px max(16px,env(safe-area-inset-left,0px)) 10px;position:relative;background:var(--bg)}
.sheet-head::before{content:"";position:absolute;top:6px;left:50%;width:40px;height:4px;border-radius:4px;background:var(--line);transform:translateX(-50%)}
.sheet-head h2{margin:0;font:700 1.35rem/1.15 var(--f-label);letter-spacing:.02em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.close{width:40px;height:40px;border-radius:50%;border:0;background:var(--paper);display:grid;place-items:center;cursor:pointer;flex:none;color:var(--ink)}
.sheet-body{overflow:auto;padding:4px max(16px,env(safe-area-inset-left,0px)) 18px;display:flex;flex-direction:column;gap:14px}
.sheet-foot{display:flex;gap:8px;padding:12px max(16px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--paper);flex-wrap:wrap;align-items:center}
.sheet-foot .btn.primary{flex:1}
.fs{padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:none}
.fs-title{font:700 .8rem var(--f-label);letter-spacing:.16em;text-transform:uppercase;color:var(--olive);margin:0}
.fs.diary-fs{background:var(--amber-soft);border-color:transparent}
.fs.diary-fs .fs-title{color:var(--amber-ink)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.field .lbl{font:600 .78rem var(--f-label);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
input,select,textarea{font:16px var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-height:46px}
.diary-fs textarea,.diary-fs input{background:var(--paper)}
textarea{min-height:88px;resize:vertical;font-family:var(--f-diary);line-height:1.5}
.dur{display:flex;align-items:center;gap:8px}
.dur input{width:5.2em;text-align:center;font-variant-numeric:tabular-nums}
.dur span{color:var(--muted);font-size:.92rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:420px){.grid3{grid-template-columns:1fr 1fr}}
.drop{display:flex;gap:12px;align-items:center;padding:14px;border:1.5px dashed var(--olive);border-radius:14px;background:var(--olive-soft);cursor:pointer}
.drop .vicon{background:var(--paper)}
.drop strong{display:block}
.drop small{color:var(--muted)}
.drop.ok{border-style:solid}
.mood{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mood button{display:flex;flex-direction:column;align-items:center;gap:5px;font:600 .86rem var(--f-body);padding:10px 4px;border-radius:10px;border:1px solid var(--line);background:var(--paper);cursor:pointer}
.mood button .dot{width:12px;height:12px;margin:0}
.mood button[aria-pressed="true"]{border:2px solid var(--amber-ink);padding:9px 3px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tiles div{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tiles b{display:block;font:700 1.4rem/1.1 var(--f-label);font-variant-numeric:tabular-nums}
.tiles span{font:600 .68rem var(--f-label);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.profile{padding:12px 14px 8px}
.profile svg{width:100%;height:96px;display:block;margin-top:6px}
.kv{padding:4px 14px}
.kv div{display:flex;justify-content:space-between;gap:12px;padding:10px 0}
.kv div+div{border-top:1px solid var(--line)}
.kv dt{color:var(--muted);font-size:.9rem}
.kv dd{margin:0;text-align:right;font-weight:500;min-width:0}
.diary{background:var(--amber-soft);border-radius:14px;padding:14px 16px;font-family:var(--f-diary);font-size:1.03rem;line-height:1.6}
.diary dt{font:700 .74rem var(--f-label);letter-spacing:.14em;text-transform:uppercase;color:var(--amber-ink);margin-top:12px}
.diary dt:first-child{margin-top:0}
.diary dd{margin:2px 0 0;white-space:pre-wrap}
.picks{display:grid;gap:10px}
.pick{display:flex;align-items:center;gap:14px;padding:16px}
.pick .vicon{width:52px;height:52px;border-radius:14px}
.pick.camp .vicon{background:var(--amber-soft);color:var(--amber-ink)}
.pick strong{display:block;font:700 1.3rem var(--f-label);letter-spacing:.02em}
.pick small{color:var(--muted);font-size:.9rem}
.confirm{display:flex;flex-direction:column;gap:8px;width:100%}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;z-index:30;font-weight:600;white-space:nowrap}
.linkbtn{background:none;border:0;padding:0;color:var(--olive);font:inherit;text-decoration:underline;cursor:pointer}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
.syncline{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;border-top:1px dashed color-mix(in srgb,var(--hero-fg) 30%,transparent);padding:10px 0 0;color:var(--hero-dim);cursor:pointer;text-align:left;font-size:.86rem}
.syncline span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.syncline strong{color:var(--hero-fg);font-weight:600}
.syncline svg{width:18px;height:18px}
.syncline.ok>svg:first-child{color:#9fc26a}
.syncline.warn>svg:first-child,.syncline.warn strong{color:#f3c15a}
.syncline:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.gcard{padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--hero-bg);color:var(--hero-fg);border-color:transparent}
.gcard strong{font:700 1.2rem var(--f-label);letter-spacing:.02em;color:#fff}
.gcard p{margin:0;color:var(--hero-dim);font-size:.92rem}
.gbtn{background:#fff;color:#1f1f1f;border-color:#fff;align-self:flex-start}
</style>
</head>
<body>

<header class="hero">
  <div class="hero-in">
    <div class="brand">
      <img class="logo" src="icons/logo.webp" alt="Toppa del corso: I can fly, primo corso ASD Volo anch'io" width="76" height="76">
      <div><p class="eyebrow">Primo corso · ASD Volo anch'io</p><h1>Libretto di volo</h1></div>
    </div>
    <div class="hstats">
      <div><b id="g-voli">0</b><span>Voli</span></div>
      <div><b id="g-ore">0:00</b><span>Ore di volo</span></div>
      <div><b id="g-camp">0</b><span>Campetti</span></div>
    </div>
    <button class="alert" id="alert" hidden></button>
    <button class="syncline" id="sync" aria-label="Account e salvataggio"></button>
  </div>
</header>

<main class="wrap">
  <p class="status" id="status" hidden></p>
  <section class="view" id="v-libretto"></section>
  <section class="view" id="v-vele" hidden></section>

  <section class="view" id="v-checklist" hidden></section>
</main>

<button class="btn amber fab" id="fab"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Nuova uscita</button>

<nav class="tabbar" aria-label="Sezioni">
  <div class="tabbar-in" role="tablist">
    <button role="tab" id="tab-libretto" data-tab="libretto" aria-selected="true"><span class="pillbg"><svg class="i" viewBox="0 0 24 24"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3"/><path d="M9 7h6"/></svg></span>Libretto</button>
    <button role="tab" id="tab-vele" data-tab="vele" aria-selected="false"><span class="pillbg"><svg class="i" viewBox="0 0 24 24"><path d="M2.5 10c5.5-6.5 13.5-6.5 19 0"/><path d="M2.5 10c5.5-3 13.5-3 19 0"/><path d="M4.5 9.2L12 20l7.5-10.8M9 7.5L12 20l3-12.5"/></svg></span>Vele</button>
    <button role="tab" id="tab-scadenze" data-tab="scadenze" aria-selected="false"><span class="pillbg"><svg class="i" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></span>Scadenze</button>
    <button role="tab" id="tab-checklist" data-tab="checklist" aria-selected="false"><span class="pillbg"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M8.3 12.4l2.6 2.6 4.8-5.4"/></svg></span>Pre-volo</button>
  </div>
</nav>
<div id="sheet-root"></div>

<script src="config.js"></script>
<script>
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MESI=['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
const MESI_L=['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
const TIPI=['Volo con istruttore','Volo da solo','Volo in biposto'];
const ESERCIZI=['Preparazione vela','Gonfiaggio frontale','Gonfiaggio rovescio','Controllo a terra','Corsa di decollo','Piccoli voli','Atterraggio'];
const MOODS=[['Teso','var(--bad)'],['Incerto','var(--warn)'],['Sereno','var(--olive)'],['Pieno','var(--amber)']];
const moodColor=m=>(MOODS.find(x=>x[0]===m)||[])[1]||'var(--muted)';
const CHECK=[
 ['Vela',['Bordo d\'attacco aperto e pulito, nessun cassone chiuso','Cordini districati, nessun nodo o cravatta','Freni liberi, passati nelle carrucole, maniglie a portata']],
 ['Imbrago ed emergenza',['Cosciali chiusi','Ventrale chiusa e regolata','Moschettoni chiusi e bloccati','Maniglia dell\'emergenza libera, spinotti in sede']],
 ['Pilota',['Casco allacciato','Radio accesa sul canale della scuola','Telefono o vario acceso, traccia avviata','Guanti e abbigliamento adatto alla quota']],
 ['Condizioni',['Vento in decollo nei limiti del mio livello','Spazio davanti libero, nessuno in decollo','Atterraggio scelto, piano chiaro anche per l\'alternativa','Mi sento lucido e tranquillo per volare oggi']]
];
const SUGG=['Certificato medico','Assicurazione RC','Ripiegatura emergenza','Revisione vela','Tessera club','Esame attestato VDS'];
const IC={
  close:'<svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  wing:'<svg class="i" viewBox="0 0 24 24"><path d="M2.5 10c5.5-6.5 13.5-6.5 19 0"/><path d="M2.5 10c5.5-3 13.5-3 19 0"/><path d="M4.5 9.2L12 20l7.5-10.8M9 7.5L12 20l3-12.5"/></svg>',
  ground:'<svg class="i" viewBox="0 0 24 24"><path d="M2.5 20.5h19"/><path d="M4 13c4.5-5.5 11.5-5.5 16 0"/><path d="M6 12.4l6 6.6 6-6.6"/></svg>',
  file:'<svg class="i" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 13l2.5 2.5L15 12"/></svg>',
  chev:'<svg class="i chevron" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>',
  bell:'<svg class="i" viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg>'
};
const isCamp=f=>f.genere==='campetto';
let flights=[], deadlines=[], vele=[], tab='libretto', filtro='tutto';
let checks={}; try{checks=JSON.parse(localStorage.getItem('pv-checks')||'{}')}catch(e){}

function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function status(t){const s=$('#status');s.hidden=!t;s.textContent=t||''}
function fmtDur(m){m=Math.round(m||0);return Math.floor(m/60)+':'+String(m%60).padStart(2,'0')}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function daysTo(iso){const a=new Date(today()+'T00:00:00'),b=new Date(iso+'T00:00:00');return Math.round((b-a)/864e5)}
function fmtDate(iso){if(!iso)return'';const[y,m,d]=iso.split('-');return +d+' '+MESI[+m-1]+' '+y}

/* ---------- IGC ---------- */
function hav(a,b){const R=6371,r=x=>x*Math.PI/180;const dLa=r(b.lat-a.lat),dLo=r(b.lon-a.lon);const h=Math.sin(dLa/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function parseIGC(text){
  let date=null;const pts=[];let add=0,prev=-1;
  for(const l of text.split(/\r?\n/)){
    if(l.startsWith('HFDTE')){const m=l.slice(5).match(/(\d{2})(\d{2})(\d{2})/);if(m)date='20'+m[3]+'-'+m[2]+'-'+m[1]}
    else if(l[0]==='B'&&l.length>=35){
      let t=+l.substr(1,2)*3600+ +l.substr(3,2)*60+ +l.substr(5,2);
      if(prev>=0&&t+add<prev)add+=86400;t+=add;prev=t;
      let lat=+l.substr(7,2)+ +l.substr(9,5)/60000;if(l[14]==='S')lat=-lat;
      let lon=+l.substr(15,3)+ +l.substr(18,5)/60000;if(l[23]==='W')lon=-lon;
      const pa=+l.substr(25,5),ga=+l.substr(30,5);
      if(!isNaN(lat)&&!isNaN(lon))pts.push({t,lat,lon,alt:ga||pa});
    }
  }
  if(pts.length<2)throw new Error('Il file non contiene punti di traccia leggibili.');
  const a=pts[0],z=pts[pts.length-1];
  let max=-1e9,far=0;
  for(const p of pts){if(p.alt>max)max=p.alt;const d=hav(a,p);if(d>far)far=d}
  const step=Math.max(1,Math.floor(pts.length/120));const prof=[];for(let i=0;i<pts.length;i+=step)prof.push(pts[i].alt);
  return {data:date||today(),t0:a.t,t1:z.t,durata:Math.round((z.t-a.t)/60),quotaMax:max,quotaDecollo:a.alt,quotaAtterraggio:z.alt,
    distanza:Math.round(far*10)/10,decLat:+a.lat.toFixed(5),decLon:+a.lon.toFixed(5),profilo:prof};
}
function guessSite(lat,lon){let best=null,bd=1.5;for(const f of flights){if(f.decLat==null)continue;const d=hav({lat,lon},{lat:f.decLat,lon:f.decLon});if(d<bd){bd=d;best=f}}return best?best.sito:''}

/* ---------- orari e durata ---------- */
function toMin(t){if(!t)return null;const[h,m]=t.split(':');return (+h)*60+(+m)}
function spanMin(a,b){const x=toMin(a),y=toMin(b);if(x==null||y==null)return null;let d=y-x;if(d<0)d+=1440;return d}
function durField(id,f,lab){
  return `<div class="grid2"><div class="field"><label for="${id}-a">${lab[0]}</label><input type="time" id="${id}-a" value="${esc(f.inizio)}"></div>
    <div class="field"><label for="${id}-b">${lab[1]}</label><input type="time" id="${id}-b" value="${esc(f.fine)}"></div></div>
    <p class="hint" id="${id}-out" aria-live="polite"></p>`}
function wireDur(id,prev){const out=document.getElementById(id+'-out');
  const upd=()=>{const d=spanMin(document.getElementById(id+'-a').value,document.getElementById(id+'-b').value);
    out.innerHTML=d!=null?'Durata: <strong>'+fmtDur(d)+'</strong>':(prev?'Durata registrata: '+fmtDur(prev)+'. Inserisci inizio e fine per ricalcolarla.':'Inserisci inizio e fine: la durata si calcola da sola.')};
  document.getElementById(id+'-a').addEventListener('input',upd);document.getElementById(id+'-b').addEventListener('input',upd);upd()}
function setTimes(id,a,b){document.getElementById(id+'-a').value=a;document.getElementById(id+'-b').value=b;document.getElementById(id+'-a').dispatchEvent(new Event('input'))}
function readTimes(id,prev){const a=document.getElementById(id+'-a').value,b=document.getElementById(id+'-b').value;const d=spanMin(a,b);return {inizio:a,fine:b,durata:d!=null?d:(prev??null)}}
function localHM(date,sec){const[y,m,d]=date.split('-');const t=new Date(Date.UTC(+y,+m-1,+d,0,0,sec));return String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0')}

/* ---------- vele ---------- */
function velaLabel(v){return v.nome+(v.taglia?' '+v.taglia:'')}
function velaName(f){const v=vele.find(x=>x.id===f.velaId);return v?velaLabel(v):(f.vela||'')}
function velaDefault(){const p=vele.find(v=>v.principale);if(p)return p.id;
  const last=flights.filter(x=>x.velaId&&vele.some(v=>v.id===x.velaId)).sort((a,b)=>(b.data||'').localeCompare(a.data||''))[0];
  return last?last.velaId:(vele[0]?vele[0].id:'')}
function velaSelect(id,f){
  const cur=('velaId' in f)?f.velaId:(f.id?'':velaDefault());
  if(!vele.length)return `<div class="field"><span class="lbl">Vela</span><p class="hint">Nessuna vela salvata. <button type="button" class="linkbtn" data-gotovele>Aggiungila nella sezione Vele</button>${f.vela?' · ora: '+esc(f.vela):''}</p></div>`;
  return `<div class="field"><label for="${id}">Vela</label><select id="${id}"><option value="">Nessuna indicata</option>${vele.map(v=>`<option value="${esc(v.id)}" ${v.id===cur?'selected':''}>${esc(velaLabel(v))}</option>`).join('')}</select></div>`}
function readVela(id){const el=document.getElementById(id);if(!el)return {};const v=vele.find(x=>x.id===el.value);return {velaId:el.value,vela:v?velaLabel(v):''}}

/* ---------- render ---------- */
function sparkPath(p,w,h,pad){const mn=Math.min(...p),mx=Math.max(...p),r=(mx-mn)||1;return p.map((a,i)=>(i?'L':'M')+((i/(p.length-1))*w).toFixed(1)+' '+(h-pad-((a-mn)/r)*(h-2*pad)).toFixed(1)).join(' ')}
function renderHero(){
  const real=flights.filter(f=>!f.esempio&&!isCamp(f));
  $('#g-voli').textContent=real.length;
  $('#g-ore').textContent=fmtDur(real.reduce((s,f)=>s+(+f.durata||0),0));
  $('#g-camp').textContent=flights.filter(isCamp).length;
  const next=[...deadlines].filter(d=>d.data&&daysTo(d.data)<=30).sort((a,b)=>a.data.localeCompare(b.data))[0];
  const al=$('#alert');
  if(next){const n=daysTo(next.data);al.hidden=false;
    al.innerHTML=`${IC.bell}<span><strong>${esc(next.titolo)}</strong><small>${n<0?'Scaduta da '+(-n)+' giorni':n===0?'Scade oggi':'Scade tra '+n+' giorni'} · ${fmtDate(next.data)}</small></span>`}
  else al.hidden=true;
}
function entryCard(f){
  const[y,m,d]=(f.data||'--').split('-');const c=isCamp(f);
  const title=(c?f.luogo:f.sito)||(c?'Campo non indicato':'Decollo non indicato');
  const vn=velaName(f);
  let right;
  if(c)right=`<b>${f.gonfiaggi!=null?esc(f.gonfiaggi):'—'}</b><small>gonfiaggi</small>`;
  else right=`<b>${fmtDur(f.durata)}</b>${f.profilo&&f.profilo.length>1?`<svg class="spark" viewBox="0 0 64 18" preserveAspectRatio="none" aria-hidden="true"><path d="${sparkPath(f.profilo,64,18,2)}" fill="none" stroke="var(--olive)" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>`:`<small>${f.quotaMax?esc(f.quotaMax)+' m':'durata'}</small>`}`;
  return `<button class="card entry${c?' camp':''}" data-open="${esc(f.id)}">
    <div class="dblock"><b>${+d||'?'}</b><span>${MESI[+m-1]||''}</span></div>
    <div class="emain"><strong>${esc(title)}</strong>
      <div class="meta">${f.esempio?'<span class="chip-t ex">Esempio</span>':''}<span class="chip-t${c?' camp':''}">${c?'Campetto':esc(f.tipo||'Volo')}</span>${f.umore?`<span><i class="dot" style="background:${moodColor(f.umore)}"></i>${esc(f.umore)}</span>`:''}${vn?`<span>${esc(vn)}</span>`:''}</div></div>
    <div class="eright">${right}</div></button>`;
}
function renderLibretto(){
  const v=$('#v-libretto');
  const all=[...flights].sort((a,b)=>(b.data||'').localeCompare(a.data||'')||(b.creato||0)-(a.creato||0));
  const list=all.filter(f=>filtro==='tutto'||(filtro==='campetti')===isCamp(f));
  let h='';
  if(CONFIGURED&&(!auth||!auth.email))h+=`<div class="card gcard"><strong>Salva il libretto nel tuo Google Drive</strong><p>Ritrovi voli e diario su ogni dispositivo. I dati vanno in una cartella privata del tuo Drive: nessun altro li vede.</p><button class="btn gbtn" data-login>${GLOGO} Accedi con Google</button></div>`;
  if(!all.length){
    h+=`<div class="card empty"><svg class="art" viewBox="0 0 120 72" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M10 26C38 2 82 2 110 26"/><path d="M10 26C38 14 82 14 110 26"/><path d="M30 12.5v9M50 7.5v8M70 7.5v8M90 12.5v9"/><path d="M16 24L60 62L104 24M42 18L60 62L78 18"/><circle cx="60" cy="64" r="4" fill="currentColor"/></svg>
      <strong>Il libretto è pronto</strong><p>Registra la prima uscita: un campetto o un volo. Per i voli puoi caricare la traccia .igc della tua app.</p>
      <div class="row"><button class="btn amber" data-new="camp">${IC.ground} Campetto</button><button class="btn primary" data-new="volo">${IC.wing} Volo</button></div></div>`;
  }else{
    h+=`<div class="seg" role="group" aria-label="Mostra">${[['tutto','Tutto'],['voli','Voli'],['campetti','Campetti']].map(([k,l])=>`<button data-filtro="${k}" aria-pressed="${filtro===k}">${l}</button>`).join('')}</div>`;
    if(!list.length)h+=`<div class="card empty"><p>${filtro==='campetti'?'Nessun campetto registrato.':'Nessun volo registrato.'}</p></div>`;
    let cur='';
    for(const f of list){const k=(f.data||'').slice(0,7);if(k!==cur){cur=k;const[y,m]=k.split('-');h+=`<h3 class="month">${MESI_L[+m-1]||''} ${y||''}</h3>`}h+=entryCard(f)}
  }
  h+=`<div class="card backup"><span class="lbl">Backup</span><p class="hint">Scarica una copia di tutto in un file, oppure carica un backup, anche quello creato con il libretto su Claude.</p>
    <div class="row"><button class="btn small" id="exp">Esporta</button><label class="btn small" for="imp-file">Importa</label><input type="file" id="imp-file" accept=".json,application/json" hidden></div>
    <p class="hint" id="imp-msg"></p></div>`;
  v.innerHTML=h;
}
function renderVele(){
  const box=$('#v-vele');const list=[...vele].sort((a,b)=>(b.principale?1:0)-(a.principale?1:0)||(a.nome||'').localeCompare(b.nome||''));
  let h=`<div class="vhead"><h2>Le mie vele</h2><button class="btn primary small" id="add-vela">+ Aggiungi</button></div>`;
  if(!list.length)h+=`<div class="card empty"><svg class="art" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width:72px"><path d="M2.5 10c5.5-6.5 13.5-6.5 19 0"/><path d="M2.5 10c5.5-3 13.5-3 19 0"/><path d="M4.5 9.2L12 20l7.5-10.8M9 7.5L12 20l3-12.5"/></svg>
    <strong>Nessuna vela</strong><p>Aggiungi la tua vela, o quelle della scuola che usi più spesso. A ogni uscita scegli quale hai usato.</p></div>`;
  h+=list.map(x=>{const us=flights.filter(f=>f.velaId===x.id);const vo=us.filter(f=>!isCamp(f));const ore=vo.reduce((s,f)=>s+(+f.durata||0),0);
    const sub=[x.taglia&&'Taglia '+x.taglia,x.classe,x.anno&&'dal '+x.anno].filter(Boolean).join(' · ');
    return `<button class="card vcard" data-editvela="${esc(x.id)}"><div class="vtop"><span class="vicon">${IC.wing}</span><div style="min-width:0"><strong>${esc(x.nome)}</strong>${sub?`<small>${esc(sub)}</small>`:''}</div>${x.principale?'<span class="star">Principale</span>':''}</div>
    ${x.note?`<p class="hint">${esc(x.note)}</p>`:''}
    <div class="mini"><div><b>${vo.length}</b><span>Voli</span></div><div><b>${fmtDur(ore)}</b><span>Ore</span></div><div><b>${us.length-vo.length}</b><span>Campetti</span></div></div></button>`}).join('');
  box.innerHTML=h;
}
function renderScadenze(){
  const v=$('#v-scadenze');
  const list=[...deadlines].sort((a,b)=>(a.data||'').localeCompare(b.data||''));
  let h=`<div class="vhead"><h2>Scadenze</h2><button class="btn primary small" id="add-dl">+ Aggiungi</button></div>`;
  if(!list.length)h+=`<div class="card empty"><strong>Niente in scadenza</strong><p>Aggiungi certificato medico, assicurazione, ripiegatura dell'emergenza: qui vedi a colpo d'occhio cosa sta per scadere.</p></div>`;
  h+=list.map(d=>{const n=daysTo(d.data);const cls=n<0?'bad':n<=30?'warn':'';
    const big=n<0?-n:n;const lab=n<0?'gg fa':n===0?'oggi':n===1?'giorno':'giorni';
    return `<button class="card due ${cls}" data-editdl="${esc(d.id)}"><div class="cd"><b>${n===0?'!':big}</b><span>${lab}</span></div>
    <div style="min-width:0"><strong>${esc(d.titolo)}</strong><small>${n<0?'Scaduta il ':'Scade il '}${fmtDate(d.data)}${d.note?' · '+esc(d.note):''}</small></div>${IC.chev}</button>`}).join('');
  const missing=SUGG.filter(s=>!deadlines.some(d=>(d.titolo||'').toLowerCase()===s.toLowerCase()));
  if(missing.length)h+=`<span class="lbl" style="margin-top:8px">Da aggiungere</span><div class="chips">${missing.map(s=>`<button class="chip" data-sugg="${esc(s)}">+ ${esc(s)}</button>`).join('')}</div>`;
  v.innerHTML=h;
}
function renderChecklist(){
  const v=$('#v-checklist');const all=CHECK.flatMap(([g,it])=>it.map((t,i)=>g+'|'+i));const done=all.filter(k=>checks[k]).length;
  const ok=done===all.length,C=2*Math.PI*26,pct=done/all.length;
  let h=`<div class="vhead"><h2>Pre-volo</h2><button class="btn ghost small" id="reset-ck">Azzera</button></div>
  <div class="card ready"><svg class="ring" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="26" fill="none" stroke="var(--line)" stroke-width="6"/><circle cx="32" cy="32" r="26" fill="none" stroke="${ok?'var(--ok)':'var(--olive)'}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${(C*pct).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 32 32)"/><text x="32" y="37" text-anchor="middle" font-family="Barlow Condensed, sans-serif" font-weight="700" font-size="16" fill="var(--ink)">${done}/${all.length}</text></svg>
    <div><strong style="color:${ok?'var(--ok)':'var(--ink)'}">${ok?'Pronto al decollo':'Controlli prima del decollo'}</strong><small>${ok?'Tutto spuntato. Buon volo.':'Spunta ogni voce mentre la verifichi.'}</small></div></div>`;
  h+=CHECK.map(([g,it])=>{const n=it.filter((t,i)=>checks[g+'|'+i]).length;return `<div class="card cgroup"><h3>${esc(g)}<span>${n}/${it.length}</span></h3>${it.map((t,i)=>{const k=g+'|'+i;return `<label class="citem ${checks[k]?'done':''}"><input type="checkbox" id="ck-${esc(g.replace(/\W/g,''))}-${i}" data-ck="${esc(k)}" ${checks[k]?'checked':''}><span>${esc(t)}</span></label>`}).join('')}</div>`}).join('');
  h+=`<p class="hint">La checklist non sostituisce il briefing: in corso, l'ultima parola sul decollo è dell'istruttore.</p>`;
  v.innerHTML=h;
}
function renderAll(){renderHero();renderLibretto();renderVele();renderScadenze();renderChecklist()}
function setTab(t){tab=t;for(const b of document.querySelectorAll('.tabbar button'))b.setAttribute('aria-selected',b.dataset.tab===t);
  for(const id of ['libretto','vele','scadenze','checklist'])$('#v-'+id).hidden=id!==t;$('#fab').hidden=t!=='libretto';window.scrollTo(0,0)}

/* ---------- fogli ---------- */
function closeSheet(){$('#sheet-root').innerHTML=''}
function openSheet(title,body,foot){
  $('#sheet-root').innerHTML=`<div class="sheet-bg" id="sbg"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="sheet-head"><h2>${esc(title)}</h2><button class="close" id="x" aria-label="Chiudi">${IC.close}</button></div>
    <div class="sheet-body">${body}</div>${foot?`<div class="sheet-foot" id="foot">${foot}</div>`:''}</div></div>`;
  $('#sbg').addEventListener('click',e=>{if(e.target.id==='sbg')closeSheet()});$('#x').onclick=closeSheet;
}
function askDelete(what,onYes,onNo){
  $('#foot').innerHTML=`<div class="confirm"><span>Eliminare ${what}? Non si può annullare.</span><div class="row"><button class="btn danger" id="yes" style="flex:1">Sì, elimina</button><button class="btn" id="no" style="flex:1">Annulla</button></div></div>`;
  $('#yes').onclick=onYes;$('#no').onclick=onNo;
}
function chooseKind(){

    <button class="card pick camp" data-new="camp"><span class="vicon">${IC.ground}</span><span><strong>Campetto</strong><small>Gonfiaggi, esercizi a terra, consigli dell'istruttore, diario</small></span></button>
    <button class="card pick" data-new="volo"><span class="vicon">${IC.wing}</span><span><strong>Volo</strong><small>Traccia .igc, decollo, quote e durata, diario del volo</small></span></button></div>`);

function diaryView(f,second){
  const items=[['Come mi sentivo',f.umore],['Cosa è andato bene',f.bene],[second,f.paura],['Cosa porto alla prossima uscita',f.prossimo]].filter(x=>x[1]);
  if(!items.length)return '';
  return `<span class="lbl">Diario</span><dl class="diary" style="margin:0">${items.map(([a,b])=>`<dt>${a}</dt><dd>${esc(b)}</dd>`).join('')}</dl>`;
}
function diaryForm(f,second){
  return `<div class="card fs diary-fs"><p class="fs-title">Diario</p>
    <div class="field"><span class="lbl">Come mi sentivo</span><div class="mood" id="mood">${MOODS.map(([m,c])=>`<button type="button" aria-pressed="${m===f.umore}" data-m="${m}"><i class="dot" style="background:${c}"></i>${m}</button>`).join('')}</div></div>
    <div class="field"><label for="f-bene">Cosa è andato bene</label><textarea id="f-bene">${esc(f.bene)}</textarea></div>
    <div class="field"><label for="f-paura">${second}</label><textarea id="f-paura">${esc(f.paura)}</textarea></div>
    <div class="field"><label for="f-pross">Cosa porto alla prossima uscita</label><textarea id="f-pross">${esc(f.prossimo)}</textarea></div></div>`;
}
function wireMood(get,set){$('#mood').onclick=e=>{const b=e.target.closest('button');if(!b)return;set(get()===b.dataset.m?'':b.dataset.m);for(const x of $('#mood').children)x.setAttribute('aria-pressed',x.dataset.m===get())}}
function kv(rows){rows=rows.filter(r=>r[1]);return rows.length?`<dl class="card kv" style="margin:0">${rows.map(([a,b])=>`<div><dt>${a}</dt><dd>${esc(b)}</dd></div>`).join('')}</dl>`:''}

function showFlight(id){
  const f=flights.find(x=>x.id===id);if(!f)return;
  if(isCamp(f))return showCamp(f);
  const prof=f.profilo&&f.profilo.length>1?(()=>{const mn=Math.min(...f.profilo),mx=Math.max(...f.profilo);const d=sparkPath(f.profilo,300,96,6);
    return `<div class="card profile"><span class="lbl">Profilo di quota · ${mn}–${mx} m</span><svg viewBox="0 0 300 96" preserveAspectRatio="none" role="img" aria-label="Profilo di quota del volo"><path d="${d} L300 96 L0 96 Z" fill="var(--olive-soft)"/><path d="${d}" fill="none" stroke="var(--olive)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg></div>`})():'';
  openSheet(f.sito||'Volo',`
   <div class="meta"><span class="chip-t">${esc(f.tipo||'Volo')}</span>${f.esempio?'<span class="chip-t ex">Esempio</span>':''}<span>${fmtDate(f.data)}${f.inizio?' · '+esc(f.inizio)+(f.fine?'–'+esc(f.fine):''):''}</span></div>
   <div class="tiles"><div><b>${fmtDur(f.durata)}</b><span>Durata</span></div><div><b>${f.quotaMax!=null?esc(f.quotaMax)+' m':'—'}</b><span>Quota max</span></div><div><b>${f.distanza!=null?esc(f.distanza)+' km':'—'}</b><span>Distanza</span></div></div>
   ${prof}

/* ---------- backup ---------- */
function exportData(){
  const out={app:'libretto-di-volo',versione:2,esportato:new Date().toISOString(),voli:flights.filter(x=>!x.esempio),vele,scadenze:deadlines};
  const url=URL.createObjectURL(new Blob([JSON.stringify(out,null,2)],{type:'application/json'}));
  const a=document.createElement('a');a.href=url;a.download='libretto-volo-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),5000);toast('Backup pronto');
}
async function importData(file){
  try{const d=JSON.parse(await file.text());if(d.app!=='libretto-di-volo')throw new Error('x');
    let n=0;const now=Date.now();
    for(const col of COLS)for(const it of (d[col]||[])){if(!it||!it.id||it.eliminato)continue;const {id,...rest}=it;putItem(col,String(id),{...rest,agg:Math.max(rest.agg||0,now)});n++}
    commit();toast('Importate '+n+' voci');
  }catch(e){const m=$('#imp-msg');if(m)m.textContent='Questo file non è un backup del libretto. Scegli il file .json creato con “Esporta”.'}
}

/* ---------- archivio sul telefono ---------- */
const COLS=['voli','vele','scadenze'];
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let store=LS.get('lv-data',null)||{};for(const c of COLS)if(!Array.isArray(store[c]))store[c]=[];
function derive(){flights=store.voli.filter(x=>!x.eliminato);vele=store.vele.filter(x=>!x.eliminato);deadlines=store.scadenze.filter(x=>!x.eliminato)}
function putItem(col,id,data){const arr=store[col];const i=arr.findIndex(x=>x.id===id);const it={...JSON.parse(JSON.stringify(data)),id};if(i>=0)arr[i]=it;else arr.push(it)}
function commit(){LS.set('lv-data',store);dirty=true;LS.set('lv-dirty',true);derive();renderAll();scheduleSync()}
async function saveDoc(col,id,data){const {id:_x,eliminato:_e,...rest}=data;putItem(col,id,{...rest,agg:Date.now()});commit()}
async function removeDoc(col,id){putItem(col,id,{eliminato:true,agg:Date.now()});commit()}

/* ---------- Google: accesso ---------- */
const CFG=window.LIBRETTO_CONFIG||{};
const CONFIGURED=!!(CFG.clientId&&/\.apps\.googleusercontent\.com$/.test(CFG.clientId)&&!/INCOLLA/.test(CFG.clientId));
const SCOPE='https://www.googleapis.com/auth/drive.appdata https://www.googleapis.com/auth/userinfo.email';
const REDIRECT=location.origin+location.pathname.replace(/index\.html$/,'');
let auth=LS.get('lv-auth',null);
let dirty=LS.get('lv-dirty',false),lastSync=LS.get('lv-last',0),fileId=LS.get('lv-file',null);
let syncState='idle',syncing=false,again=false,syncTimer=null;
const tokenOk=()=>!!(auth&&auth.token&&auth.exp>Date.now());

function login(silent){
  if(!CONFIGURED)return;
  const st=Math.random().toString(36).slice(2)+Date.now().toString(36);
  LS.set('lv-state',{st,silent:!!silent});
  if(!silent)LS.set('lv-nosilent',false);
  const p=new URLSearchParams({client_id:CFG.clientId,redirect_uri:REDIRECT,response_type:'token',scope:SCOPE,include_granted_scopes:'true',state:st});
  if(auth&&auth.email)p.set('login_hint',auth.email);
  if(silent)p.set('prompt','none');
  location.assign('https://accounts.google.com/o/oauth2/v2/auth?'+p.toString());
}
function readRedirect(){
  if(!location.hash||location.hash.length<2)return null;
  const h=new URLSearchParams(location.hash.slice(1));
  if(!h.has('access_token')&&!h.has('error'))return null;
  history.replaceState(null,'',REDIRECT);
  const saved=LS.get('lv-state',null);LS.set('lv-state',null);
  if(!saved||h.get('state')!==saved.st)return {error:'state'};
  if(h.get('error'))return {error:h.get('error'),silent:saved.silent};
  auth={token:h.get('access_token'),exp:Date.now()+((+h.get('expires_in'))||3600)*1000-60000,email:(auth&&auth.email)||''};
  LS.set('lv-auth',auth);return {ok:true};
}
async function checkAccount(){
  const r=await gapi('https://www.googleapis.com/oauth2/v3/userinfo');const j=await r.json();
  if(!j.email)return;
  if(auth.email&&auth.email!==j.email){
    // un altro account su questo telefono: non mescolare i dati
    store={voli:[],vele:[],scadenze:[]};fileId=null;dirty=false;lastSync=0;
    LS.set('lv-data',store);LS.set('lv-file',null);LS.set('lv-dirty',false);LS.set('lv-last',0);derive();renderAll();
  }
  auth.email=j.email;LS.set('lv-auth',auth);
}
function logout(){
  if(auth&&auth.token){try{fetch('https://oauth2.googleapis.com/revoke?token='+encodeURIComponent(auth.token),{method:'POST',mode:'no-cors'})}catch(e){}}
  auth=null;store={voli:[],vele:[],scadenze:[]};fileId=null;dirty=false;lastSync=0;
  for(const k of ['lv-auth','lv-data','lv-file','lv-dirty','lv-last'])try{localStorage.removeItem(k)}catch(e){}
  derive();renderAll();renderSync();
}

/* ---------- Google Drive: cartella privata dell'app ---------- */
async function gapi(url,opt={}){
  const r=await fetch(url,{...opt,headers:{...(opt.headers||{}),Authorization:'Bearer '+auth.token}});
  if(r.status===401){auth.exp=0;LS.set('lv-auth',auth);throw {code:'auth'}}
  if(!r.ok)throw {code:'http',status:r.status};
  return r;
}
async function findFile(){
  const q=encodeURIComponent("name='libretto.json'");
  const r=await gapi('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&fields=files(id,modifiedTime)&orderBy=modifiedTime%20desc&q='+q);
  const j=await r.json();return j.files&&j.files[0];
}
async function downloadFile(id){const r=await gapi('https://www.googleapis.com/drive/v3/files/'+id+'?alt=media');try{return await r.json()}catch(e){return {}}}
async function uploadFile(id,data){
  const body=JSON.stringify(data);
  if(id){await gapi('https://www.googleapis.com/upload/drive/v3/files/'+id+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':'application/json'},body});return id}
  const b='libretto'+Date.now();
  const mp='--'+b+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify({name:'libretto.json',parents:['appDataFolder']})+'\r\n--'+b+'\r\nContent-Type: application/json\r\n\r\n'+body+'\r\n--'+b+'--';
  const r=await gapi('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body:mp});
  return (await r.json()).id;
}
function merge(a,b){const out={};for(const c of COLS){const m=new Map();for(const it of [...(a[c]||[]),...(b[c]||[])]){if(!it||!it.id)continue;const p=m.get(it.id);if(!p||(it.agg||0)>(p.agg||0))m.set(it.id,it)}out[c]=[...m.values()]}return out}
function canon(d){return JSON.stringify(COLS.map(c=>[...(d[c]||[])].sort((x,y)=>x.id<y.id?-1:x.id>y.id?1:0)))}
async function sync(){
  if(!tokenOk()){renderSync();return}
  if(!navigator.onLine){syncState='offline';renderSync();return}
  if(syncing){again=true;return}
  syncing=true;syncState='sync';renderSync();
  try{
    let id=fileId,remote=null;
    if(id){try{remote=await downloadFile(id)}catch(e){if(e.status===404)id=null;else throw e}}
    if(!id){const f=await findFile();if(f){id=f.id;remote=await downloadFile(id)}}
    remote=remote||{};
    const merged=merge(store,remote);
    if(!id||canon(merged)!==canon(remote))id=await uploadFile(id,{app:'libretto-di-volo',versione:2,...merged});
    fileId=id;LS.set('lv-file',id);
    const fin=merge(store,merged);const later=canon(fin)!==canon(merged);
    store=fin;LS.set('lv-data',store);dirty=later;LS.set('lv-dirty',dirty);if(later)again=true;
    lastSync=Date.now();LS.set('lv-last',lastSync);syncState='ok';derive();renderAll();
  }catch(e){syncState=e&&e.code==='auth'?'login':'error'}
  finally{syncing=false;renderSync();if(again){again=false;setTimeout(sync,400)}}
}
function scheduleSync(){clearTimeout(syncTimer);if(tokenOk())syncTimer=setTimeout(sync,1200);else renderSync()}

/* ---------- stato della sincronizzazione ---------- */
const CLOUD='<svg class="i" viewBox="0 0 24 24"><path d="M7 18.5h10.5a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.6 9.1 4.7 4.7 0 0 0 7 18.5z"/></svg>';
function syncInfo(){
  if(!CONFIGURED)return ['warn','Solo su questo telefono','App non ancora collegata a Google'];
  if(!auth||!auth.email&&!tokenOk())return ['warn','Accedi con Google','I dati sono solo su questo telefono'];
  if(syncing||syncState==='sync')return ['','Sincronizzo…',auth.email];
  if(!navigator.onLine||syncState==='offline')return ['warn','Senza rete',dirty?'Le modifiche restano sul telefono e partono appena torna la rete':'Salvato sul telefono'];
  if(!tokenOk()||syncState==='login')return ['warn',dirty?'Da sincronizzare':'Ricollega Google',auth.email||''];
  if(syncState==='error')return ['warn','Drive non risponde','Riprovo alla prossima modifica'];
  return ['ok','Su Google Drive',auth.email||''];
}
function renderSync(){
  const el=$('#sync');if(!el)return;const [cls,a,b]=syncInfo();
  el.className='syncline '+cls;el.innerHTML=`${CLOUD}<span><strong>${esc(a)}</strong>${b?' · '+esc(b):''}</span>${IC.chev}`;
}
function fmtWhen(t){if(!t)return 'mai';const d=new Date(t);const hm=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  const iso=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');return (iso===today()?'oggi':fmtDate(iso))+' alle '+hm}
function accountSheet(){
  if(!CONFIGURED){openSheet('Salvataggio',`<div class="card fs"><p style="margin:0">Questa copia dell'app non è ancora collegata a Google: voli e diario restano solo su questo telefono. Chi gestisce l'app deve inserire l'ID client di Google nel file <code>config.js</code>.</p></div>`);return}
  if(!auth||!auth.email){
    openSheet('Accedi con Google',`<div class="card fs">
      <p style="margin:0">Accedendo, il libretto si salva in una <strong>cartella privata del tuo Google Drive</strong> e lo ritrovi su ogni telefono o computer.</p>
      <p class="hint">L'app vede solo la propria cartella, non gli altri file del tuo Drive. Nessun altro, nemmeno chi ha creato l'app, può leggere i tuoi dati.</p></div>`,
      `<button class="btn primary" data-login>${GLOGO} Accedi con Google</button>`);return}
  openSheet('Il tuo account',`<dl class="card kv" style="margin:0">
      <div><dt>Account</dt><dd>${esc(auth.email)}</dd></div>
      <div><dt>Ultima sincronizzazione</dt><dd>${esc(fmtWhen(lastSync))}</dd></div>
      <div><dt>Modifiche in attesa</dt><dd>${dirty?'Sì':'No'}</dd></div></dl>
    <p class="hint">I dati sono nella cartella privata dell'app sul tuo Google Drive, e una copia resta sul telefono per usarlo anche senza rete.</p>`,
    `${tokenOk()?'<button class="btn primary" id="do-sync">Sincronizza ora</button>':'<button class="btn primary" data-login>Ricollega Google</button>'}<button class="btn danger" id="logout">Esci</button>`);
  const ds=$('#do-sync');if(ds)ds.onclick=async()=>{closeSheet();await sync();toast(syncState==='ok'?'Sincronizzato':'Sincronizzazione non riuscita')};
  $('#logout').onclick=()=>askDelete(dirty?'i dati da questo telefono? Alcune modifiche non sono ancora su Drive e andrebbero perse':'i dati da questo telefono? Restano al sicuro sul tuo Drive',()=>{logout();closeSheet();toast('Uscito')},accountSheet);
}
const GLOGO='<svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3 0 5.8 1.1 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>';

/* ---------- eventi ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab]');if(t)return setTab(t.dataset.tab);
  if(e.target.closest('[data-login]'))return login(false);
  if(e.target.closest('#sync'))return accountSheet();
  const nw=e.target.closest('[data-new]');if(nw)return nw.dataset.new==='camp'?editCamp(null):editFlight(null);
  const fl=e.target.closest('[data-filtro]');if(fl){filtro=fl.dataset.filtro;return renderLibretto()}
  const o=e.target.closest('[data-open]');if(o)return showFlight(o.dataset.open);
  const ed=e.target.closest('[data-editdl]');if(ed)return editDeadline(deadlines.find(x=>x.id===ed.dataset.editdl));
  const sg=e.target.closest('[data-sugg]');if(sg)return editDeadline(null,sg.dataset.sugg);
  if(e.target.closest('#add-dl'))return editDeadline(null);
  if(e.target.closest('#exp'))return exportData();
  if(e.target.closest('#add-vela'))return editVela(null);
  const ev=e.target.closest('[data-editvela]');if(ev)return editVela(vele.find(x=>x.id===ev.dataset.editvela));
  if(e.target.closest('[data-gotovele]')){closeSheet();return setTab('vele')}
  if(e.target.closest('#alert'))return setTab('scadenze');
  if(e.target.closest('#reset-ck')){checks={};try{localStorage.setItem('pv-checks','{}')}catch(_){}return renderChecklist()}
});
document.addEventListener('change',e=>{
  if(e.target.id==='imp-file'){const f=e.target.files[0];e.target.value='';if(f)importData(f);return}
  const k=e.target.dataset&&e.target.dataset.ck;if(!k)return;checks[k]=e.target.checked;try{localStorage.setItem('pv-checks',JSON.stringify(checks))}catch(_){}renderChecklist()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
window.addEventListener('online',()=>{syncState='idle';if(tokenOk())sync();else renderSync()});
window.addEventListener('offline',()=>{syncState='offline';renderSync()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&tokenOk()&&Date.now()-lastSync>60000)sync()});
$('#fab').onclick=chooseKind;

/* ---------- avvio ---------- */
derive();renderAll();renderSync();
(async()=>{
  const red=readRedirect();
  if(red&&red.error){
    if(red.silent)LS.set('lv-nosilent',true);
    else if(red.error!=='access_denied')status('Accesso a Google non riuscito. Riprova toccando “Accedi con Google”.');
    syncState='login';renderSync();return;
  }
  if(tokenOk()){
    if(red&&red.ok){try{await checkAccount()}catch(e){}}
    await sync();return;
  }
  if(CONFIGURED&&auth&&auth.email&&navigator.onLine&&!LS.get('lv-nosilent',false)){
    const last=LS.get('lv-silent-at',0);
    if(Date.now()-last>120000){LS.set('lv-silent-at',Date.now());login(true);return}
  }
  renderSync();
})();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
